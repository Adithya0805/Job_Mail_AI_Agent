# Root-level railway.toml — tells Railway where the Dockerfile lives
# startCommand is intentionally removed — the Dockerfile CMD uses sh -c for $PORT expansion
[build]
  builder = "DOCKERFILE"
  dockerfilePath = "backend/Dockerfile"

[deploy]
  healthcheckPath = "/health"
  healthcheckTimeout = 30
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 3
